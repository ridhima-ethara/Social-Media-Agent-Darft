# The web tier: the Vite bundle, and a same-origin path to the API.
#
# Serving both from one origin is what lets the bundle ship with
# VITE_API_URL=/api — no hostname baked in, no CORS, and the browser's
# EventSource has nothing to object to.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Corpus upload is base64-in-JSON and the API accepts 12 MB of body; nginx
  # must not reject it first with a 413 the client would report as "the server
  # returned something that is not JSON".
  client_max_body_size 20m;

  # Vite content-hashes these, so a stale one can never be served for new code.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API. No path rewriting: the server mounts every route under /api
  # itself, so the URI is passed through exactly as it arrived.
  location /api/ {
    # Docker's embedded DNS, re-checked every 10s. A literal `proxy_pass
    # http://api:4001` resolves ONCE at config load and caches that IP for the
    # life of the process — so after `docker compose restart api` the container
    # comes back on a new IP and nginx keeps posting to the old one, failing
    # with 502s that look like the API is down when it is running fine.
    # Resolution happens per request only when the upstream is a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4001;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # THREE ROUTES HERE STREAM, AND ONE HOLDS FOR MINUTES.
    #
    #   GET  /api/events            the global SSE stream
    #   POST /api/assistant/command SSE-over-POST — frames, then `event: end`
    #   POST /api/agents/run        the Python tier's NDJSON, relayed as SSE
    #   POST /api/pipeline/run      not a stream, but a discovery run executes
    #                               INSIDE the request, so it is held open for
    #                               the whole crawl
    #
    # Buffering would swallow the frames until the response closed, turning a
    # live run console into a blank screen that fills in at the end. And the
    # default 60s read timeout would cut a pipeline run mid-crawl, leaving a
    # `running` row nothing reconciles. Both defaults are wrong here.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # One bundle, and the store picks the screen — so every path that is not a
  # real file serves index.html rather than 404ing on a deep link.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
