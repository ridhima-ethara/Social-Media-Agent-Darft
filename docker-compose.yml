# ETHARA SOCIALAI — on-prem stack.
#
#   cp .env.docker.example .env
#   docker compose up -d --build
#   open http://localhost:8080
#
# Four services. Only `web` publishes a port: the API, the database and the
# model server talk to each other on the compose network and are not reachable
# from outside the host. That is the point of putting nginx in front — one door,
# same-origin, and no CORS to configure.
#
# WHAT DOES NOT RUN HERE. mflux (FLUX.2 Klein on MLX) needs Apple Silicon and
# Metal, which no Linux container has. MFLUX_PYTHON is left blank and creatives
# render through the local brand SVG renderer with the reason stamped on the
# card — the product's documented degradation, visible in the UI and on
# /api/health, not a silent loss.

name: ethara-socialai

services:
  # ── Postgres ──────────────────────────────────────────────────────────
  db:
    # pgvector, NOT plain postgres. `schema.sql` declares vector(768) columns
    # for semantic retrieval and `db:migrate` refuses to apply against a server
    # without the extension — correctly, since serving the API against a schema
    # that never applied would fail later and less legibly. This image is the
    # stock Postgres 17 with pgvector compiled in; the fix the migration itself
    # prints.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ethara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ethara}
      POSTGRES_DB: ${POSTGRES_DB:-ethara_socialai}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately NOT published. Uncomment only to attach a client from the
    # host, and prefer `docker compose exec db psql` to leaving 5432 open.
    # ports:
    #   - '5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ethara} -d ${POSTGRES_DB:-ethara_socialai}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── API · agent runtime · Python tier ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ethara-socialai-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The server spawns Python, which spawns Chromium. Without an init the
    # container accumulates zombie browser processes over a long-running
    # deployment until it cannot fork.
    init: true
    # Chromium writes to /dev/shm and Docker's 64 MB default is the classic
    # cause of "Target closed" mid-crawl.
    shm_size: 1gb
    # THE HOST'S OWN CONFIGURATION, READ AT RUN TIME — never baked into a layer.
    # Later files win, so secrets.env overrides the blank placeholders .env
    # carries for the same keys. Both are excluded from the build context.
    #
    # Everything the app can be configured with lives in these two files and is
    # picked up here unchanged: model choice, actor slugs, thresholds, tokens.
    # The `environment:` block below deliberately does NOT restate them.
    env_file:
      - ./server/.env
      - ./server/secrets.env
    #
    # ONLY WHAT MUST DIFFER INSIDE A CONTAINER.
    #
    # `environment` beats `env_file` in compose, so every key listed here
    # silently overrides the host's value — which is right for a path or a
    # service address and wrong for anything else. A `${VAR:-}` default here
    # would blank a real token whenever the shell did not happen to export it,
    # so credentials and tuning are left to the files above.
    environment:
      # Service addresses. The host files point these at localhost, which
      # inside a container means the container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ethara}:${POSTGRES_PASSWORD:-ethara}@db:5432/${POSTGRES_DB:-ethara_socialai}
      PORT: '4001'
      # Same-origin through nginx, so no browser ever sends a cross-origin
      # request. Kept narrow rather than '*' because the API has no auth.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}

      # Filesystem paths. The host's are macOS paths that do not exist here.
      CRAWL4AI_PYTHON: /app/backend/.venv/bin/python
      # The service-account JSON is bind-mounted read-only below rather than
      # copied in: an image layer is readable by anyone who can pull the image,
      # and survives a later layer deleting the file.
      GCP_SERVICE_ACCOUNT_JSON: /run/secrets/gcp-sa.json

      # Intentionally blank. MLX is Apple-Silicon-only and needs Metal, which no
      # Linux container has, so mflux cannot run here at any setting. With
      # Gemini configured the creative background comes from it; with neither,
      # the local brand SVG renderer takes over and says so on every asset.
      MFLUX_PYTHON: ''

      # Container boot behaviour — meaningless on the host, so defined only here.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # `auto` seeds ONLY a database with no ideas and no captured posts, so a
      # restart cannot wipe the calendar. `true` reseeds and DELETES existing
      # content; `false` never seeds. See docker/entrypoint.sh.
      RUN_SEED: ${RUN_SEED:-auto}
    volumes:
      # Operator-supplied documents for `npm run corpus:ingest`. Bind-mounted so
      # a PDF dropped on the host is ingestable without rebuilding.
      - ./corpus:/app/corpus
      # THE GCP SERVICE ACCOUNT, READ-ONLY AND NEVER IN A LAYER.
      # `${GCP_SA_FILE}` is a host path; the container only ever sees the mount.
      # Comment this out if you authenticate with GCP_API_KEY instead — the
      # adapter prefers the key when both are present.
      - ${GCP_SA_FILE:-./server/secrets/gcp-sa.json}:/run/secrets/gcp-sa.json:ro
      # The Python tier's own store, which is where the Calendar, Content and
      # Image agents recall from. On a named volume so a rebuild does not
      # discard what the Learning Agent has written.
      - brain:/app/backend/data
    # Published only if you want to reach the API directly, bypassing nginx.
    # ports:
    #   - '4001:4001'

  # ── Web ───────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ethara-socialai-web:local
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  # ── Local text model · removed ─────────────────────────────────────────
  # Ollama has been removed. Text generation runs on Gemini (GCP_* keys); with
  # no Google credential the deterministic template writer and parser take over,
  # labelled as such in the UI.

volumes:
  pgdata:
    name: ethara-socialai-pgdata
  brain:
    name: ethara-socialai-brain
