services:
  db:
    image: postgres:17-alpine
    container_name: ethara-sma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethara
      POSTGRES_PASSWORD: ethara
      POSTGRES_DB: ethara_sma
      TZ: Asia/Kolkata
    ports:
      - '5432:5432'
    volumes:
      - ethara-sma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ethara -d ethara_sma']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  ethara-sma-pgdata:
    name: ethara-sma-pgdata
