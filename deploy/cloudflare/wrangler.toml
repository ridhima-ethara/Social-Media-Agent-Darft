# ═══════════════════════════════════════════════════════════════════════════
# CLOUDFLARE PAGES — THE WEB TIER ONLY
#
# This deploys `dist/` (the React bundle) to Cloudflare Pages. It does NOT and
# cannot deploy the API: see deploy/cloudflare/README.md for why — the API needs
# to spawn subprocesses, reach PostgreSQL with pgvector, and talk to a local
# model daemon, none of which exist inside a V8 isolate.
#
# Deployed on its own, every screen renders and reports that it is not connected,
# which is a supported state but not a working product. Point the bundle at an
# API you host elsewhere with VITE_API_URL at BUILD time — Vite inlines it, so it
# cannot be set here.
# ═══════════════════════════════════════════════════════════════════════════

name = "ethara-socialai"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# ── Headers and SPA routing ────────────────────────────────────────────────
# The app has no router: `page` in the Zustand store selects the screen, so every
# path must serve index.html and let the client decide. Cloudflare Pages does
# this by default for a single-page app; `_routes.json` below excludes /api so a
# same-origin proxy can be attached later without Pages swallowing it.

[env.production]
compatibility_date = "2026-09-01"
